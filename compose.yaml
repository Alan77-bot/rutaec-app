
services:
 
  postgres:
    image: postgres:17-alpine
    container_name: rutaec-app-postgres17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rutaec_postgres18_data:/var/lib/postgresql
      - ./database/init/rutaec_schema.sql:/docker-entrypoint-initdb.d/01-rutaec-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=rutaec
      COMPROBANTES_DIR: /var/lib/rutaec/comprobantes
    ports:
      - "3000:3000"
    volumes:
      - rutaec_comprobantes_data:/var/lib/rutaec/comprobantes
    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  rutaec_postgres_data:
  rutaec_postgres18_data:
  rutaec_comprobantes_data:
